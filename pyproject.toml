[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kavunbet-optimizer-service"
version = "0.1.0"
description = "REST API and optimization orchestration service for KavunBet slot mathematics"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0,<1.0",
    "uvicorn[standard]>=0.53.0,<1.0",
    "pydantic>=2.14.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.14,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kavunbet_optimizer*"]

[tool.setuptools.package-data]
kavunbet_optimizer = ["configs/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.workspace]
members = [
    "kavunbet-optimizer",
]
